<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<style>
    .drawing-1{
        height: 200px;
        width: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #799EFF;
        position: relative;
        margin: 200px;
        margin-left: 30%;


    }

    .drawing-1 h1{
        color: blue;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        text-decoration: underline;
    }
        
    
    .circle-1, .circle-2, .circle-3, .circle-4{
        background-color: red;
        height: 40px;
        width: 40px;
        border-radius: 20px;
    }
    .circle-1{
    position: absolute;
    top: -12px;
    left: -18px;
    }
     .circle-2{
    position: absolute;
    bottom: -17px;
    left: -14px;
    } 
     .circle-3{
    position: absolute;
    top: -17px;
    right: -14px;
    } 

     .circle-4{
    position: absolute;
    bottom: -17px;
    right: -14px;
     } 
</style>

<body>
<div class="drawing-1" >
<h1>Text</h1>   
<div class="circle-1" ></div>
<div class="circle-2" ></div>
<div class="circle-3" ></div>
<div class="circle-4" ></div>
</div>
   
</body>
</html>
