<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="youtube-style.css">
</head>
<body>
<body>
  <header class="header">
    <div class="left">
      <span class="menu-icon">☰</span>
      <img src="https://www.logo.wine/a/logo/YouTube/YouTube-White-Full-Color-Dark-Background-Logo.wine.svg" alt="YouTube Logo" class="logo">
    </div>
    <div class="center">
      <input type="text" class="search" placeholder="Search" />
      <button class="search-btn">🔍</button>
    </div>
    <div class="right">
      <span class="icon">📹</span>
      <span class="icon">🔔</span>
      <span class="icon">👤</span>
    </div>
  </header>

  <div class="container">
    <nav class="sidebar">
      <a href="#">🏠 Home</a>
      <a href="#">🔥 Shorts</a>
      <a href="#">📺 Subscriptions</a>
      <hr />
      <a href="#">📚 Library</a>
      <a href="#">🕒 History</a>
    </nav>

    <main class="video-grid">
      <!-- Repeat this block for each video -->
      <div class="video-card">
        <img src="https://via.placeholder.com/300x180" alt="Video Thumbnail">
        <div class="video-info">
          <img src="https://via.placeholder.com/40" class="channel-icon">
          <div>
            <h4>Video Title</h4>
            <p>Channel Name</p>
            <p>1M views · 1 day ago</p>
          </div>
        </div>
      </div>
      <!-- You can duplicate the above div to simulate multiple videos -->
    </main>
  </div>
</body>
</html>    
</body>
</html>
